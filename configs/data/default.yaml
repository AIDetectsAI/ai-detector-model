dataset:
  name: processed_dataset
  path: ${paths.data}/processed/
  channels: 3
  batch_size: 64
  shuffle: true
  num_workers: 4
  pin_memory: true

  transforms:
    resize: [148, 148]       
    crop_size: [128, 128]   

    horizontal_flip: true
    vertical_flip: false
    rotation: 15

    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

  split:
    train: 0.7
    val: 0.15
    test: 0.15
