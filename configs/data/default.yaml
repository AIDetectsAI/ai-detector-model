out_features: 1

dataset:
  name: processed_dataset
  path: ${paths.data}/processed/
  channels: 3
  batch_size: 64
  shuffle: true
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2

  transforms:
    horizontal_flip_p: 0.5
    vertical_flip_p: 0.0
    rotation: 15

    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

  split:
    train: 0.7
    val: 0.15
    test: 0.15
