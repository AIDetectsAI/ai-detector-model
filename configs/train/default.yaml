optimizer:
  adamw:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.001
    weight_decay: 1e-4
  adam:
    _target_: torch.optim.Adam
    _partial_: true
    lr: 0.001
    weight_decay: 1e-4

loss_function:
  _target_: torch.nn.BCEWithLogitsLoss

metric:
  name: f1
  mode: max

scheduler:
  type: step_lr
  step_size: 10
  gamma: 0.1

epochs: 30

grad_clip: 1.0

log_interval: 10
checkpoint_interval: 5
